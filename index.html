<!DOCTYPE html>
  <html lang="pt-BR">
    <head>

      <meta charset="UTF-8" />
      <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      <!-- PWA Meta Tags -->
      <meta name="theme-color" content="#00d4ff" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="ClimateArgos" />
      <link rel="apple-touch-icon" href="/assets/icon-192.png" />

      <title>ClimateArgos — Monitoramento Climático via Satélite</title>
      <meta name="description" content="Monitoramento climático em tempo real com dados de satélite, mapas interativos e alertas de risco de enchentes baseados em inteligência artificial." />
      <meta name="robots" content="noindex, nofollow" />
      <link rel="manifest" href="/manifest.json" />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    </head>

    <body>

      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('SW registered:', reg.scope))
              .catch(err => console.log('SW registration failed:', err));
          });
        }
      </script>

    </body>
  </html>
